name: Vale Linting

# Trigger this workflow on pull requests that modify docs files anywhere
on:
  pull_request:
    # Check for changes to the adoc file types anywhere in the repo
    paths:
      - '**/*.adoc'  

# Define the permissions this workflow needs
permissions:
  contents: read          # Needed to fetch repository content
  pull-requests: write    # Needed to update PR comments
  issues: write           # Needed to post comments (issues API)

jobs:
  lint:
    # Run this job on the latest Ubuntu VM
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the PR repository so we can lint its files
      - name: Checkout Docs Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ensure full history is available (needed for PR comparison)

      # Step 2: Checkout the SUSE Vale Style Guide repository
      - name: Checkout SUSE Style Guide
        uses: actions/checkout@v4
        with:
          repository: 'openSUSE/suse-vale-styleguide'
          path: 'suse-styles'  # Checkout into a specific folder

      # Step 3: Install dependencies
      - name: Install Vale, jq, and Asciidoctor
        run: |
          # Update package list
          sudo apt-get update

          # Install Asciidoctor (for .adoc processing), jq (JSON parsing), curl, tar
          sudo apt-get install -y asciidoctor jq curl tar

          # Set the Vale version to install
          VALE_VERSION="3.12.0"

          # URL to download the Vale tar.gz
          VALE_URL="https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"

          # Prepare temporary install directory
          mkdir -p /tmp/vale-install

          # Download and extract Vale
          curl -L "$VALE_URL" | tar -xz -C /tmp/vale-install/

          # Move Vale binary to /usr/local/bin for global access
          sudo mv /tmp/vale-install/vale /usr/local/bin/
          sudo chmod +x /usr/local/bin/vale  # Make it executable

      # Step 4: Configure Vale
      - name: Configure Vale
        run: |
          # Remove default spelling file to avoid conflicts with SUSE style guide
          rm -f suse-styles/common/Spelling.yml

          # Create the main Vale configuration file
          # Set StylesPath to the checked-out style guide
          echo "StylesPath = $GITHUB_WORKSPACE/suse-styles" > .vale.ini

          # Minimum alert level: 'warning' (ignore 'info' messages)
          echo "MinAlertLevel = warning" >> .vale.ini
          echo "" >> .vale.ini

          # Configure rules for AsciiDoc files
          echo "[*.adoc]" >> .vale.ini
          echo "BasedOnStyles = common, asciidoc" >> .vale.ini
          echo "" >> .vale.ini

          # Configure rules for Markdown files
          echo "[*.md]" >> .vale.ini
          echo "BasedOnStyles = common" >> .vale.ini
          echo "" >> .vale.ini

          # Configure rules for plain text files
          echo "[*.txt]" >> .vale.ini
          echo "BasedOnStyles = common" >> .vale.ini

      # Step 5: Run Vale and post/update PR comment
      # This step executes Vale on the modified documentation files and posts/updates the linting report 
      # directly in the Pull Request comment thread.
      - name: Run Vale and Post/Update PR Comment
        env:
          # Currently uses the automatically provided GITHUB_TOKEN (works within the same repo).
          EXTERNAL_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: |
          # Use 'set -e' to ensure the script fails immediately if any command encounters an error.
          set -e

          # Change directory to the repository root for correct file path resolution
          cd "$GITHUB_WORKSPACE"

          # Assign the token from the environment variable to a local shell variable for API calls
          GITHUB_TOKEN_VAR="$EXTERNAL_TOKEN"

          # Define constants used in the report and API logic
          STYLE_GUIDE_URL="https://documentation.suse.com/style/current/html/style-guide-adoc/index.html"
          MAX_ISSUES=50 # Maximum number of issues to display in the collapsible table

          echo "=== Fetching changed files using git diff ==="

          # Get essential PR and commit details from the GitHub event payload JSON
          PR_NUMBER=$(jq -r .pull_request.number < "$GITHUB_EVENT_PATH")
          BASE_SHA=$(jq -r .pull_request.base.sha < "$GITHUB_EVENT_PATH")
          COMMIT_SHA=$(jq -r .pull_request.head.sha < "$GITHUB_EVENT_PATH")

          # Construct the base API endpoint for PR comments
          COMMENTS_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments"
          
          # Construct the base repository URL for creating clickable file links in the report
          GITHUB_REPO_URL="https://github.com/${GITHUB_REPOSITORY}"

          # Use git diff to find file paths modified between the PR's base and head commits.
          # --diff-filter=d: Excludes deleted files (only lint changes/additions).
          # grep -E '\.(adoc|md|txt)$': Filters for the documentation file extensions.
          CHANGED_FILES=$(git diff --name-only --diff-filter=d "$BASE_SHA" "$COMMIT_SHA" \
            | grep -E '\.(adoc|md|txt)$' || true) # || true prevents script exit if no files are found

          # Check if any relevant files were modified. If not, exit gracefully.
          if [ -z "$CHANGED_FILES" ]; then
            echo "No relevant files (.adoc, .md, .txt) changed in this PR. Skipping Vale linting."
            exit 0
          fi

          echo "Changed files to lint:"
          echo "$CHANGED_FILES"

          echo "=== Running Vale ==="

          # Execute Vale on the list of changed files.
          # --output=JSON: Ensures machine-readable JSON output.
          # --no-exit: Ensures the script continues even if linting errors are found (we handle errors via exit code later).
          VALE_OUTPUT=$(echo "$CHANGED_FILES" | xargs /usr/local/bin/vale --config="$GITHUB_WORKSPACE/.vale.ini" --output=JSON --no-exit || true)

          # Save the raw JSON output to a file for structured parsing.
          echo "$VALE_OUTPUT" | jq '.' > vale_output.json

          # Fetch all existing comments on this PR using the authorized token.
          COMMENTS_JSON=$(curl -s -H "Authorization: token $GITHUB_TOKEN_VAR" "$COMMENTS_URL")

          # Function: Find the ID of the existing Vale Linter report comment.
          # Search for the generic report title or success message, 
          # ignoring the commit SHA. This ensures the action UPDATES the existing comment.
          find_existing_comment() {
            echo "$COMMENTS_JSON" | jq -r ".[] 
              | select(.user.login==\"github-actions[bot]\") 
              | select(.body | contains(\"Vale Linter Report\") or contains(\"No Vale issues found\")) 
              | .id" | head -n 1 # Get the ID of the first match found
          }

          # Function: Post a new comment or update an existing one (PATCH vs. POST request).
          post_comment() {
            local body="$1"
            local id="$2"
            if [ -n "$id" ]; then
              # Update existing comment using PATCH request
              curl -s -X PATCH -H "Authorization: token $GITHUB_TOKEN_VAR" \
                  -d "{\"body\": $body}" \
                  "$COMMENTS_URL/$id" > /dev/null
            else
              # Post new comment using POST request
              curl -s -H "Authorization: token $GITHUB_TOKEN_VAR" \
                  -X POST -d "{\"body\": $body}" "$COMMENTS_URL" > /dev/null
            fi
          }

          # --- CASE 1: No Vale issues found ---
          # Check if the JSON output contains any "Severity" key (the marker for an issue).
          if ! echo "$VALE_OUTPUT" | grep -q '"Severity"'; then
            # Use the full, robustly quoted success message with tracking markers.
            # This prevents the unexpected EOF error and ensures the comment can be updated by future runs.
            COMMENT_BODY=$(jq -Rs . <<< "✅ No Vale issues found — great job following the [SUSE Style Guide]($STYLE_GUIDE_URL)! ")
            
            COMMENT_ID=$(find_existing_comment)
            post_comment "$COMMENT_BODY" "$COMMENT_ID"
            echo "✅ Vale: No issues found on PR #$PR_NUMBER for commit $COMMIT_SHA"
            exit 0 # Exit successfully if linting is clean
          fi

          # --- CASE 2: Vale issues found ---
          # Count errors and warnings using jq for the summary
          ERRORS=$(jq '[.[][] | select(.Severity=="error")] | length' vale_output.json)
          WARNINGS=$(jq '[.[][] | select(.Severity=="warning")] | length' vale_output.json)

          # Start building the Markdown report file
          echo "### 📝 Vale Linter Report — commit $COMMIT_SHA — $(date -u +"%Y-%m-%d %H:%M UTC")" > vale_report.md
          echo "" >> vale_report.md
          echo "**Summary:** $ERRORS ❌ errors, $WARNINGS ⚠️ warnings" >> vale_report.md
          echo "" >> vale_report.md
          # Start the collapsible section
          echo "<details>" >> vale_report.md
          echo "<summary>Click to expand Vale issues (max $MAX_ISSUES)</summary>" >> vale_report.md
          echo "" >> vale_report.md

          # Table header for issue details
          echo "| File | Line | Severity | Message | Suggestion | Rule | Rule Link |" >> vale_report.md
          echo "|------|------|---------|--------|------------|------|-----------|" >> vale_report.md

          # Process and format individual issues (up to MAX_ISSUES)
          jq -r --arg guide "$STYLE_GUIDE_URL" --argjson max "$MAX_ISSUES" '
            to_entries[] as $file |             # Start by iterating over each file found (key = filename)
            $file.value[] |                     # Then iterate over the list of issues for that file
            .File = $file.key |                 # Inject the filename (map key) into the issue object (required for path display)
            @base64                             # Base64 encode the complete issue object for safe shell piping
          ' vale_output.json | head -n "$MAX_ISSUES" | while read -r line; do
            # Helper function to decode and extract JSON properties
            _jq() { echo "$line" | base64 --decode | jq -r "$1"; }
            
            # Extract issue details
            FILE=$(_jq '. | .File // "-"')
            LINE=$(_jq '. | .Line // "-")
            
            # Construct the clickable Markdown link to the specific line in the file at the current commit SHA
            # This implements the "./file.adoc" clickable path requested earlier
            FILE_LINK="[./$FILE]($GITHUB_REPO_URL/blob/$COMMIT_SHA/$FILE#L$LINE)"
            
            # Format severity with appropriate emoji
            SEVERITY=$(_jq 'if .Severity=="error" then "❌ error" elif .Severity=="warning" then "⚠️ warning" else .Severity end')
            MESSAGE=$(_jq '.Message // "-"')
            SUGGESTION=$(_jq '.Action.Params[0] // "-"')
            RULE=$(_jq '.Check // "-"')
            # Create a link to the corresponding rule section in the SUSE Style Guide
            LINK="[link]($STYLE_GUIDE_URL#$(echo $RULE | tr '[:upper:]' '[:lower:]'))"

            # Append the row to the markdown report file, using the clickable FILE_LINK
            echo "| $FILE_LINK | $LINE | $SEVERITY | $MESSAGE | $SUGGESTION | $RULE | $LINK |" >> vale_report.md
          done

          # Finalize the markdown report (closing tags and links)
          echo "" >> vale_report.md
          echo "</details>" >> vale_report.md
          echo "" >> vale_report.md
          echo "For more details, see the [SUSE Style Guide]($STYLE_GUIDE_URL)." >> vale_report.md
          echo "" >> vale_report.md
          echo "" >> vale_report.md

          # Convert the complete markdown report file content into a single JSON string for the API payload.
          COMMENT_BODY=$(jq -Rs . < vale_report.md)
          
          # Check for and retrieve the ID of the previous report comment
          COMMENT_ID=$(find_existing_comment)
          
          # Post or update the comment
          post_comment "$COMMENT_BODY" "$COMMENT_ID"

          echo "✅ Vale report posted/updated on PR #$PR_NUMBER for commit $COMMIT_SHA"
          # The job completes successfully regardless of linting severity, as the issue status is only reported.