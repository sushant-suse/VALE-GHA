name: Vale Linting

on:
  pull_request:
    paths:
      - 'docs/**/*.adoc'
      - 'docs/**/*.md'
      - 'docs/**/*.txt' 

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Docs Repository (Main Repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout SUSE Style Guide
        uses: actions/checkout@v4
        with:
          repository: 'openSUSE/suse-vale-styleguide'
          path: 'suse-styles'

      - name: Install Dependencies (Vale, Reviewdog, and Asciidoctor)
        run: |
          # Update and install Asciidoctor (for ADOC parsing) and jq
          sudo apt-get update
          sudo apt-get install -y asciidoctor jq

          # Install Vale (CRITICAL FIX for Exit Code 127)
          VALE_VERSION="3.12.0" 
          VALE_URL="https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          
          # Explicitly install binary with sudo
          mkdir -p /tmp/vale-install
          curl -L "${VALE_URL}" | tar -xz -C /tmp/vale-install/
          sudo mv /tmp/vale-install/vale /usr/local/bin/
          sudo chmod +x /usr/local/bin/vale

          # Install Reviewdog (for PR annotations)
          REVIEW_VERSION="0.17.0"
          REVIEW_URL="https://github.com/reviewdog/reviewdog/releases/download/v${REVIEW_VERSION}/reviewdog_${REVIEW_VERSION}_Linux_x86_64.tar.gz"
          curl -L "${REVIEW_URL}" | sudo tar -xz -C /usr/local/bin/

      - name: Configure .vale.ini
        run: |
          # Fix: Manually remove the problematic Spelling rule to bypass the dictionary dependency conflict.
          rm -f suse-styles/common/Spelling.yml

          # 1. Create the file with leading spaces (as is necessary for YAML indentation)
          cat <<EOF > .vale.ini
          StylesPath = ${GITHUB_WORKSPACE}/suse-styles
          MinAlertLevel = warning
          [*.adoc]
          BasedOnStyles = common, asciidoc
          [*.md]
          BasedOnStyles = common
          [*.txt]
          BasedOnStyles = common
          EOF

          # 2. CRITICAL FIX: Use sed to strip leading whitespace from the generated .vale.ini file
          # This guarantees a valid INI file format.
          sed -i 's/^[ \t]*//' .vale.ini

        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Run Vale and Report to GitHub PR (Script Method)
        run: |
          # Define the absolute path to the configuration file
          CONFIG_PATH="${GITHUB_WORKSPACE}/.vale.ini"

          # Create and run a temporary shell script to handle the complex jq logic safely.
          cat <<'END_SCRIPT' > run_vale.sh
          #!/bin/bash
          
          # Execute Vale using the ABSOLUTE config path
          VALE_OUTPUT=$(/usr/local/bin/vale --config="$CONFIG_PATH" --output=JSON --no-exit docs)
          
          # Check for presence of the 'Results' key with at least one opening brace
          if echo "$VALE_OUTPUT" | grep -q '"Results":\['; then
              echo "Vale found issues. Sending results to Reviewdog..."
              
              # CRITICAL: Pipe to jq for resilient parsing and formatting for RDJSONL
              echo "$VALE_OUTPUT" \
              | jq -c '.Results[] | {
                  message: .Message, 
                  location: {
                      path: .Location.Path, 
                      range: {
                          start: {line: .Location.Span.Start.Line, column: .Location.Span.Start.Column}, 
                          end: {line: .Location.Span.End.Line, column: .Location.Span.End.Column}
                      }
                  }, 
                  severity: .Level
              }' \
              | /usr/local/bin/reviewdog -f=rdjsonl \
                  -name="Vale Linter" \
                  -reporter=github-pr-review \
                  -level=warning \
                  -filter-mode=added \
                  -fail-on-error: true
          else
              echo "Vale found no issues. Skipping reviewdog reporting."
          fi
          
          END_SCRIPT
          
          # Make the script executable and run it
          chmod +x run_vale.sh
          ./run_vale.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_WORKSPACE: ${{ github.workspace }}