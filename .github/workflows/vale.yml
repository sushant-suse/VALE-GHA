name: Vale Linting

on:
  pull_request:
    paths:
      - 'docs/**/*.adoc'
      - 'docs/**/*.md'
      - 'docs/**/*.txt' 

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Docs Repository (Main Repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout SUSE Style Guide
        uses: actions/checkout@v4
        with:
          repository: 'openSUSE/suse-vale-styleguide'
          path: 'suse-styles'

      - name: Install Dependencies (Vale, Reviewdog, and Asciidoctor)
        run: |
          # Update and install Asciidoctor (for ADOC parsing) and jq
          sudo apt-get update
          sudo apt-get install -y asciidoctor jq

          # Install Vale (CRITICAL FIX for Exit Code 127)
          VALE_VERSION="3.12.0" 
          VALE_URL="https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          
          # Use a temporary directory for safe extraction and global move
          mkdir -p /tmp/vale-install
          curl -L "${VALE_URL}" | tar -xz -C /tmp/vale-install/
          sudo mv /tmp/vale-install/vale /usr/local/bin/
          sudo chmod +x /usr/local/bin/vale

          # Install Reviewdog (for PR annotations)
          REVIEW_VERSION="0.17.0"
          REVIEW_URL="https://github.com/reviewdog/reviewdog/releases/download/v${REVIEW_VERSION}/reviewdog_${REVIEW_VERSION}_Linux_x86_64.tar.gz"
          curl -L "${REVIEW_URL}" | sudo tar -xz -C /usr/local/bin/

      - name: Configure .vale.ini
        run: |
          # The spelling rule needs the 'config' folder for dictionaries. Copy it to the root.
          cp -r suse-styles/config .

          # Dynamically create the .vale.ini file in the root directory
          cat <<EOF > .vale.ini
          StylesPath = suse-styles
          MinAlertLevel = warning
                    
          [*.adoc]
          BasedOnStyles = common, asciidoc
                    
          [*.md]
          BasedOnStyles = common

          [*.txt]
          BasedOnStyles = common
          EOF

      - name: Run Vale and Report to GitHub PR
        run: |
          # Ditch vale sync as it's unnecessary and problematic
          
          # Execute Vale and store output in a variable
          VALE_OUTPUT=$(/usr/local/bin/vale --output=JSON --no-exit docs)
          
          # CRITICAL FIX: Use a robust jq filter that works regardless of the Vale version's JSON structure.
          # We check if the JSON is an array (old version) or an object with a 'Results' key (new version).
          # Then, we filter the results and pipe them to reviewdog.
          
          # Filter the results to get a stream of valid RDJSONL objects
          VALID_OUTPUT=$(echo "$VALE_OUTPUT" | jq -c '
              # If the top level is an object and has a Results array (new Vale), use that
              if type == "object" and .Results? then .Results[]
              # If the top level is an array (old Vale), use the array directly
              elif type == "array" then .[]
              # Otherwise, output nothing
              else empty
              end 
              | {
                  message: .Message, 
                  location: {
                      path: .Location.Path, 
                      range: {
                          start: {line: .Location.Span.Start.Line, column: .Location.Span.Start.Column}, 
                          end: {line: .Location.Span.End.Line, column: .Location.Span.End.Column}
                      }
                  }, 
                  severity: .Level
              } 
              | select(.severity) # Filter out any null results
          ')
          
          # CRITICAL FIX: Check if the VALID_OUTPUT variable is NOT empty before running reviewdog
          if [ -n "$VALID_OUTPUT" ]; then
            echo "Vale found issues. Sending results to Reviewdog..."
            
            echo "$VALID_OUTPUT" \
            | /usr/local/bin/reviewdog -f=rdjsonl \
              -name="Vale Linter" \
              -reporter=github-pr-review \
              -level=warning \
              -filter-mode=added \
              -fail-on-error: true
          else
            echo "Vale found no issues. Skipping reviewdog reporting."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}