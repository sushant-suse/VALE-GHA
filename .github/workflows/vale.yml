name: Vale Linting

on:
  pull_request:
    paths:
      - 'docs/**/*.adoc'
      - 'docs/**/*.md'
      - 'docs/**/*.txt' 

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Docs Repository (Main Repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout SUSE Style Guide
        uses: actions/checkout@v4
        with:
          repository: 'openSUSE/suse-vale-styleguide'
          path: 'suse-styles'

      - name: Install Dependencies (Vale, Reviewdog, and Asciidoctor)
        run: |
          # ... (installation commands are unchanged)

      - name: Configure .vale.ini
        run: |
          # Fix: Remove the problematic spelling rule to bypass the dictionary dependency
          rm -f suse-styles/common/Spelling.yml

          # Set StylesPath using the absolute GITHUB_WORKSPACE variable
          cat <<EOF > .vale.ini
          StylesPath = ${GITHUB_WORKSPACE}/suse-styles # ABSOLUTE PATH FIX
          MinAlertLevel = warning
                              
          [*.adoc]
          BasedOnStyles = common, asciidoc
                              
          [*.md]
          BasedOnStyles = common

          [*.txt]
          BasedOnStyles = common
          EOF
        env:
          # Make sure GITHUB_WORKSPACE is available for the shell script
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Run Vale and Report to GitHub PR (Script Method)
        run: |
          # Execute Vale and store output
          VALE_OUTPUT=$(/usr/local/bin/vale --output=JSON --no-exit docs)
          
          # Check for presence of the 'Results' key with at least one opening brace
          if echo "$VALE_OUTPUT" | grep -q '"Results":\['; then
              echo "Vale found issues. Sending results to Reviewdog..."
              
              # CRITICAL: Pipe to jq for resilient parsing and formatting for RDJSONL
              echo "$VALE_OUTPUT" \
              | jq -c '.Results[] | {
                  message: .Message, 
                  location: {
                      path: .Location.Path, 
                      range: {
                          start: {line: .Location.Span.Start.Line, column: .Location.Span.Start.Column}, 
                          end: {line: .Location.Span.End.Line, column: .Location.Span.End.Column}
                      }
                  }, 
                  severity: .Level
              }' \
              | /usr/local/bin/reviewdog -f=rdjsonl \
                  -name="Vale Linter" \
                  -reporter=github-pr-review \
                  -level=warning \
                  -filter-mode=added \
                  -fail-on-error: true
          else
              echo "Vale found no issues. Skipping reviewdog reporting."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass the absolute path down to the script
          GITHUB_WORKSPACE: ${{ github.workspace }}