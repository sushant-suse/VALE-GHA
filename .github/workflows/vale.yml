name: Vale Linting

on:
  pull_request:
    paths:
      - 'docs/**/*.adoc'
      - 'docs/**/*.md'
      - 'docs/**/*.txt'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout your main repository
      - name: Checkout Docs Repository (Main Repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Checkout SUSE Vale Style Guide
      - name: Checkout SUSE Style Guide
        uses: actions/checkout@v4
        with:
          repository: 'openSUSE/suse-vale-styleguide'
          path: 'suse-styles'

      # Step 3: Install Dependencies
      - name: Install Vale, Reviewdog, and Asciidoctor
        run: |
          sudo apt-get update
          sudo apt-get install -y asciidoctor jq curl tar

          # Install Vale
          VALE_VERSION="3.12.0"
          VALE_URL="https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          mkdir -p /tmp/vale-install
          curl -L "$VALE_URL" | tar -xz -C /tmp/vale-install/
          sudo mv /tmp/vale-install/vale /usr/local/bin/
          sudo chmod +x /usr/local/bin/vale

          # Install Reviewdog
          REVIEW_VERSION="0.17.0"
          REVIEW_URL="https://github.com/reviewdog/reviewdog/releases/download/v${REVIEW_VERSION}/reviewdog_${REVIEW_VERSION}_Linux_x86_64.tar.gz"
          curl -L "$REVIEW_URL" | sudo tar -xz -C /usr/local/bin/

      # Step 4: Configure .vale.ini
      - name: Configure Vale
        run: |
          rm -f suse-styles/common/Spelling.yml

          echo "StylesPath = $GITHUB_WORKSPACE/suse-styles" > .vale.ini
          echo "MinAlertLevel = warning" >> .vale.ini
          echo "" >> .vale.ini
          echo "[*.adoc]" >> .vale.ini
          echo "BasedOnStyles = common, asciidoc" >> .vale.ini
          echo "" >> .vale.ini
          echo "[*.md]" >> .vale.ini
          echo "BasedOnStyles = common" >> .vale.ini
          echo "" >> .vale.ini
          echo "[*.txt]" >> .vale.ini
          echo "BasedOnStyles = common" >> .vale.ini
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      # Step 5: Run Vale and Report
      - name: Run Vale and Report to GitHub PR
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"

          echo "=== Directory structure ==="
          ls -R docs || echo "⚠️ No docs folder found!"

          echo "=== Vale configuration ==="
          /usr/local/bin/vale ls-config --config="$GITHUB_WORKSPACE/.vale.ini" || echo "⚠️ Vale config issue!"

          echo "=== Running Vale ==="
          VALE_OUTPUT=$(/usr/local/bin/vale --config="$GITHUB_WORKSPACE/.vale.ini" --output=JSON --no-exit docs || true)

          echo "Raw JSON output from Vale:"
          echo "$VALE_OUTPUT" | jq '.' || echo "$VALE_OUTPUT"

          if echo "$VALE_OUTPUT" | grep -q '"Results":\['; then
            echo "Vale found issues. Sending results to Reviewdog..."
            echo "$VALE_OUTPUT" | jq -c '.Results[] | {
                message: .Message,
                location: {
                    path: .Location.Path,
                    range: {
                        start: {line: .Location.Span.Start.Line, column: .Location.Span.Start.Column},
                        end: {line: .Location.Span.End.Line, column: .Location.Span.End.Column}
                    }
                },
                severity: .Level
            }' | /usr/local/bin/reviewdog -f=rdjsonl \
                  -name="Vale Linter" \
                  -reporter=github-pr-review \
                  -level=warning \
                  -filter-mode=added
          else
            echo "✅ Vale found no issues (or config problem)."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
