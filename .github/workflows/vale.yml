name: Vale Linting

# Trigger the workflow on pull requests touching documentation files
on:
  pull_request:
    paths:
      - 'docs/**/*.adoc'
      - 'docs/**/*.md'
      - 'docs/**/*.txt'

# Permissions for the workflow
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the main repository (docs)
      - name: Checkout Docs Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Checkout the SUSE Vale style guide
      - name: Checkout SUSE Style Guide
        uses: actions/checkout@v4
        with:
          repository: 'openSUSE/suse-vale-styleguide'
          path: 'suse-styles'

      # Step 3: Install Vale, jq, and Asciidoctor
      - name: Install Vale, jq, and Asciidoctor
        run: |
          sudo apt-get update
          sudo apt-get install -y asciidoctor jq curl tar

          # Install Vale
          VALE_VERSION="3.12.0"
          VALE_URL="https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          mkdir -p /tmp/vale-install
          curl -L "$VALE_URL" | tar -xz -C /tmp/vale-install/
          sudo mv /tmp/vale-install/vale /usr/local/bin/
          sudo chmod +x /usr/local/bin/vale

      # Step 4: Configure Vale
      - name: Configure Vale
        run: |
          # Remove unnecessary spelling file
          rm -f suse-styles/common/Spelling.yml

          # Create Vale configuration
          echo "StylesPath = $GITHUB_WORKSPACE/suse-styles" > .vale.ini
          echo "MinAlertLevel = warning" >> .vale.ini
          echo "" >> .vale.ini
          echo "[*.adoc]" >> .vale.ini
          echo "BasedOnStyles = common, asciidoc" >> .vale.ini
          echo "" >> .vale.ini
          echo "[*.md]" >> .vale.ini
          echo "BasedOnStyles = common" >> .vale.ini
          echo "" >> .vale.ini
          echo "[*.txt]" >> .vale.ini
          echo "BasedOnStyles = common" >> .vale.ini

      # Step 5: Run Vale and post results to PR
      - name: Run Vale and Post Results to PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"

          echo "=== Running Vale ==="
          VALE_OUTPUT=$(/usr/local/bin/vale --config="$GITHUB_WORKSPACE/.vale.ini" --output=JSON --no-exit docs || true)
          echo "$VALE_OUTPUT" | jq '.' > vale_output.json

          # PR information
          PR_NUMBER=$(jq -r .pull_request.number < "$GITHUB_EVENT_PATH")
          COMMENTS_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments"

          # Function to find any existing Vale comment by the bot
          find_existing_comment() {
            curl -s -H "Authorization: token $GITHUB_TOKEN" "$COMMENTS_URL" \
              | jq -r '.[] | select(.user.login=="github-actions[bot]") | select(.body|test("Vale Linter Report|No Vale issues found")) | .id' \
              | head -n 1
          }

          # CASE 1: No Vale issues found
          if ! echo "$VALE_OUTPUT" | grep -q '"Severity"'; then
            echo "✅ No Vale issues found."
            COMMENT_BODY=$(jq -Rs . <<< "✅ No Vale issues found — great job following the [SUSE Style Guide](https://documentation.suse.com/style/current/html/style-guide-adoc/index.html)!")

            COMMENT_ID=$(find_existing_comment)
            if [ -n "$COMMENT_ID" ]; then
              echo "🪄 Updating existing Vale comment (#$COMMENT_ID)"
              curl -s -X PATCH -H "Authorization: token $GITHUB_TOKEN" \
                   -d "{\"body\": $COMMENT_BODY}" \
                   "$COMMENTS_URL/$COMMENT_ID" > /dev/null
            else
              echo "💬 Creating new 'no issues' comment"
              curl -s -H "Authorization: token $GITHUB_TOKEN" \
                   -X POST -d "{\"body\": $COMMENT_BODY}" "$COMMENTS_URL" > /dev/null
            fi
            exit 0
          fi

          # CASE 2: Vale found issues — build Markdown report
          echo "### Vale Linter Report" > vale_report.md
          echo "" >> vale_report.md
          echo "| File | Line | Severity | Message | Suggestion | Rule |" >> vale_report.md
          echo "|------|------|-----------|----------|-------------|------|" >> vale_report.md

          # Add findings to table, with icons for severity
          jq -r '
            to_entries[] as $file |
            $file.value[] |
            "| \($file.key) | \(.Line) | \(
              if .Severity == "error" then "❌ error"
              elif .Severity == "warning" then "⚠️ warning"
              else .Severity end
            ) | \(.Message) | \(.Action.Params[0] // "-") | \(.Check) |"
          ' vale_output.json >> vale_report.md

          echo "" >> vale_report.md
          echo "For more details, see the [SUSE Style Guide](https://documentation.suse.com/style/current/html/style-guide-adoc/index.html)." >> vale_report.md

          echo "Generated Vale Report:"
          cat vale_report.md

          # Post or update Vale report comment
          COMMENT_BODY=$(jq -Rs . < vale_report.md)
          COMMENT_ID=$(find_existing_comment)

          if [ -n "$COMMENT_ID" ]; then
            echo "🪄 Updating existing Vale report comment (#$COMMENT_ID)"
            curl -s -X PATCH -H "Authorization: token $GITHUB_TOKEN" \
                 -d "{\"body\": $COMMENT_BODY}" \
                 "$COMMENTS_URL/$COMMENT_ID" > /dev/null
          else
            echo "💬 Creating new Vale report comment"
            curl -s -H "Authorization: token $GITHUB_TOKEN" \
                 -X POST -d "{\"body\": $COMMENT_BODY}" "$COMMENTS_URL" > /dev/null
          fi

          echo "✅ Vale report posted/updated on PR #$PR_NUMBER"
